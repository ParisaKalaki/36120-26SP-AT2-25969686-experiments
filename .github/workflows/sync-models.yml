name: Sync Models to API Repo

on:
  push:
    branches: [main]
    paths:
      - "models/comfort_climate/**.joblib"
      - "models/weather_hazard/**.joblib"

jobs:
  sync-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimentation repo
        uses: actions/checkout@v4
        with:
          path: experiments

      - name: Checkout API repo
        uses: actions/checkout@v4
        with:
          repository: ParisaKalaki/36120-26SP-AT2-25969686-api
          token: ${{ secrets.API_REPO_TOKEN }}
          path: api

      - name: Copy model artifacts
        run: |
          cp experiments/models/comfort_climate/*.joblib api/models/comfort_climate/
          cp experiments/models/weather_hazard/*.joblib api/models/weather_hazard/

      - name: Commit and push if changed
        run: |
          cd api
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --staged --quiet; then
            echo "No model changes detected, nothing to push."
          else
            git commit -m "Automated model sync from experimentation repo (${{ github.sha }})"
            git push
          fi
